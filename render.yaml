# Render Blueprint for the Daprova API.
#
# Why tsx and not `node dist/index.js`: the DB migrations in api/migrations are
# .ts files loaded via dynamic import() at boot (see api/src/db/migrate.ts), and
# they live outside the tsc rootDir ("src"), so a compiled build never emits
# runnable .js for them. Running the server with tsx executes TypeScript
# directly — the same way it ran on Railway — so migrations and the type-only
# @daprova/shared imports both resolve without a separate build step.
#
# `npm install` at the repo root installs all workspaces and links the
# @daprova/shared symlink that api depends on.
services:
  - type: web
    name: daprova-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start --workspace=api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # ---- Secrets you must paste in the Render dashboard ----
      # Neon connection string (use the *pooled* host, and keep ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Firebase Web API key (same value as admin-web's VITE_FIREBASE_API_KEY)
      - key: FIREBASE_API_KEY
        sync: false
      # Resend key for teammate-invite emails
      - key: RESEND_API_KEY
        sync: false

      # ---- Auto-generated by Render (random, secure) ----
      - key: SESSION_JWT_SECRET
        generateValue: true
      - key: REFRESH_JWT_SECRET
        generateValue: true
      # One-time secret to provision the first org+admin on a fresh DB
      # (POST /api/v1/bootstrap). Read its value from the Render dashboard.
      - key: BOOTSTRAP_SECRET
        generateValue: true

      # ---- Frontend origins (for CORS) ----
      # Set these to the deployed frontend URLs once they exist. Until then the
      # api runs, but browser requests from the frontends will be CORS-blocked.
      - key: ADMIN_DASHBOARD_ORIGIN
        sync: false
      - key: ASSESSMENT_WEB_ORIGIN
        sync: false
      - key: PLATFORM_WEB_ORIGIN
        sync: false

      # ---- Plain config ----
      - key: FIREBASE_PROJECT_ID
        value: daprova-dev
      - key: INVITE_FROM_EMAIL
        value: onboarding@daprova.com
      # Frontends on *.pages.dev and the api on *.onrender.com are different
      # sites, so the refresh cookie must be SameSite=None. Switch back to
      # "lax" if you move everything under one domain (app./api.daprova.com).
      - key: COOKIE_SAMESITE
        value: none
      # Render terminates TLS at a proxy; trust it so per-IP rate limits see
      # the real client IP instead of lumping every learner into one bucket.
      - key: TRUST_PROXY
        value: "1"
      # PORT is provided by Render automatically; api/src/env.ts reads it.
